app = "fabrix-central"

[build]
  dockerfile = "Dockerfile"

[[services]]
  protocol = "tcp"
  internal_port = 4000

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
  [[services.ports]]
    port = 80
    handlers = ["http"]

  [services.http_checks]
    interval = "15s"
    grace_period = "30s"
    method = "GET"
    path = "/health"
    protocol = "http"
    timeout = "5s"

[env]
  PORT = "4000"
  NODE_ENV = "production"
  CORS_ORIGINS = "https://fabrix.sbs,https://www.fabrix.sbs,https://api.fabrix.sbs"
  AGENT_JWT_ACCESS_TTL = "15m"
  AGENT_JWT_REFRESH_TTL = "30d"
  AGENT_LOGIN_BASE_URL = "https://fabrix.sbs/agent/auth"
  APP_URL = "https://fabrix.sbs"
  API_URL = "https://api.fabrix.sbs"

# Secrets (set via fly secrets set):
#   DATABASE_URL
#   REDIS_URL
#   JWT_ACCESS_SECRET
#   JWT_REFRESH_SECRET
#   AGENT_JWT_ACCESS_SECRET
#   AGENT_JWT_REFRESH_SECRET
#   NEXAPAY_API_KEY

[experimental]
  allowed_public_ports = []
  auto_rollback = true

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
